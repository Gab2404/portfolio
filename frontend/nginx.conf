server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── API Proxy → Backend container ─────────────────────────────────────────
    # Using Docker's internal DNS resolver (127.0.0.11) + variable for upstream
    # prevents Nginx from crashing on startup if the backend container boots slightly later.
    resolver 127.0.0.11 valid=30s;

    location /api/ {
        set $upstream_backend http://backend:8080;
        proxy_pass         $upstream_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts (AI calls can take a few seconds)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Static files ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Static assets (no-cache to ensure updates are reflected immediately)
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }

    # ── Health check endpoint ─────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
