services:
  reverse-proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Les certificats SSL seront montés ici plus tard
      # - ./certs:/etc/nginx/certs:ro
    networks:
      - portfolio-network

networks:
  portfolio-network:
    external: true
