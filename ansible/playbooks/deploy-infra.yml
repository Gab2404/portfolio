- name: Préparation et sécurisation de l'infrastructure
  hosts: production
  become: true
  tasks:
    - name: Mise à jour du cache APT
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Installation des prérequis
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - ufw
        state: present

    - name: Configuration du pare-feu UFW (Autoriser SSH)
      ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Configuration du pare-feu UFW (Autoriser HTTP)
      ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Configuration du pare-feu UFW (Autoriser HTTPS)
      ufw:
        rule: allow
        port: '443'
        proto: tcp

    - name: Activation de UFW
      ufw:
        state: enabled
        policy: deny

    - name: Création du dossier pour les clés GPG
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Ajout de la clé GPG officielle de Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
        keyring: /etc/apt/keyrings/docker.gpg

    - name: Ajout du dépôt Docker
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Installation de Docker et Docker Compose
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Démarrage et activation du service Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Installation du module Python pour Docker (requis par Ansible)
      apt:
        name: python3-docker
        state: present

    - name: Création du réseau Docker isolé pour le portfolio
      docker_network:
        name: portfolio-network
        state: present